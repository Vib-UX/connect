[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bsc_testnet = "${BNB_RPC_URL}"

# Local unit tests stay offline. Fork suite: forge test --match-path test/ConnectEscrow.fork.t.sol
[profile.fork]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
eth_rpc_url = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
